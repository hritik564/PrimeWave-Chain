# PrimeWave Testnet — PWCScan Explorer
# TESTNET ONLY
#
# NOTE: This file must be included in the SAME nginx http{} block as rpc.conf
# so the rpc_limit zone (defined in rpc.conf) is available here.
# If deploying without rpc.conf, define the zone here:
#   limit_req_zone $binary_remote_addr zone=rpc_limit:10m rate=100r/m;
#
# Replace testnet.pwcscan.example.com with your actual domain.

limit_req_zone $binary_remote_addr zone=explorer_limit:10m rate=60r/m;

server {
    listen 80;
    server_name testnet.pwcscan.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name testnet.pwcscan.example.com;

    ssl_certificate     /etc/letsencrypt/live/testnet.pwcscan.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testnet.pwcscan.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /opt/primewave/pwcscan/dist;
    index index.html;

    # PWCScan SPA — all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Indexer API proxy (proxied from PWCScan to indexer backend)
    location /indexer-api/ {
        limit_req zone=explorer_limit burst=50 nodelay;
        proxy_pass         http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;
    }

    # Static assets with caching
    location ~* \.(js|css|png|jpg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
