# PrimeWave Testnet — Public RPC Endpoint
# TESTNET ONLY
# Place at /etc/nginx/sites-available/primewave-testnet-rpc.conf

limit_req_zone $binary_remote_addr zone=rpc_limit:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=10r/m;

upstream rpc_backend {
    least_conn;
    server 127.0.0.1:9650 fail_timeout=5s max_fails=3;
    # Add more RPC nodes for HA:
    # server rpc-node-2:9650 fail_timeout=5s max_fails=3;
    keepalive 32;
}

server {
    listen 80;
    server_name rpc.primewave-testnet.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name rpc.primewave-testnet.example.com;

    ssl_certificate     /etc/letsencrypt/live/rpc.primewave-testnet.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rpc.primewave-testnet.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CORS (adjust allowed origins for production)
    add_header Access-Control-Allow-Origin "*";
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
    add_header Access-Control-Allow-Headers "Content-Type, Authorization";

    # JSON-RPC endpoint
    location /ext/bc/ {
        limit_req zone=rpc_limit burst=200 nodelay;

        # Block dangerous admin methods via body inspection
        if ($request_method = POST) {
            # Note: Full method-level filtering requires a Lua/OpenResty approach
            # For production, use a JSON-RPC proxy that strips admin methods
        }

        proxy_pass         http://rpc_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    10s;
    }

    # WebSocket endpoint
    location /ext/bc/ws {
        limit_req zone=ws_limit burst=20 nodelay;

        proxy_pass         http://rpc_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
    }

    # AvalancheGo health check (public read-only)
    location /ext/health {
        proxy_pass http://rpc_backend;
        proxy_http_version 1.1;
    }

    # Block everything else (admin APIs, etc.)
    location / {
        return 403 "Forbidden";
    }
}
