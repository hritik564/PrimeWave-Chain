# PrimeWave Testnet — Prometheus Configuration
# TESTNET ONLY | Sprint PW-C14
# Place at /etc/prometheus/prometheus.yml on the sentinel node

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    environment: testnet
    chain_id: "77"
    network: primewave-testnet

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

scrape_configs:
  # AvalancheGo node metrics (all validator/RPC nodes)
  - job_name: 'avalanchego'
    static_configs:
      - targets:
          - '__REPLACE_VALIDATOR_1_IP__:9090'
          - '__REPLACE_VALIDATOR_2_IP__:9090'
          - '__REPLACE_VALIDATOR_3_IP__:9090'
          - '__REPLACE_VALIDATOR_4_IP__:9090'
          - '__REPLACE_VALIDATOR_5_IP__:9090'
          - '__REPLACE_RPC_NODE_IP__:9090'
        labels:
          role: 'validator'
      - targets:
          - '__REPLACE_RPC_NODE_IP__:9090'
        labels:
          role: 'rpc'
    metrics_path: /ext/metrics
    scheme: http

  # Keeper service metrics
  - job_name: 'primewave-keeper'
    static_configs:
      - targets: ['__REPLACE_INFRA_IP__:8080']
    metrics_path: /metrics

  # PostgreSQL metrics (via postgres_exporter)
  - job_name: 'postgresql'
    static_configs:
      - targets: ['__REPLACE_INFRA_IP__:9187']

  # Node exporter (system metrics) on all hosts
  - job_name: 'node_exporter'
    static_configs:
      - targets:
          - '__REPLACE_VALIDATOR_1_IP__:9100'
          - '__REPLACE_VALIDATOR_2_IP__:9100'
          - '__REPLACE_VALIDATOR_3_IP__:9100'
          - '__REPLACE_VALIDATOR_4_IP__:9100'
          - '__REPLACE_VALIDATOR_5_IP__:9100'
          - '__REPLACE_RPC_NODE_IP__:9100'
          - '__REPLACE_INFRA_IP__:9100'
          - '__REPLACE_INFRA_IP__:9100'
