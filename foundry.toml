# PrimeWave Chain — Foundry Configuration
# =========================================
# ENVIRONMENT: LOCAL DEVELOPMENT / TESTING
# NOT FOR PRODUCTION DEPLOYMENT
#
# Pinned versions (PW-C02):
#   forge/cast/anvil: v1.7.1 (commit 4072e48705, 2026-05-08)
#   Solidity:         0.8.30 (required by icm-services contracts)
#   OpenZeppelin:     v5.6.1 (primary/locked; see docs/PRIMEWAVE_DEPENDENCY_COMPATIBILITY.md)
#                     v5.1.0 (versioned alias for Avalanche StakingManager.sol only)
#
# C09: icm-contracts added as local library at contracts/lib/icm-contracts/
#   Source: ava-labs/icm-services tag icm-relayer-v1.7.5
#   See docs/PW-C09-AVALANCHE-STAKING-COMPATIBILITY.md for remapping rationale.

[profile.default]
# Solidity version — LOCKED. Do not change without a documented compatibility review.
solc = "0.8.30"

# EVM target — Shanghai (required by icm-services / OZ v5.6.1)
evm_version = "shanghai"

# Source and output directories
src    = "contracts/src"
out    = "contracts/out"
libs   = ["contracts/lib"]
test   = "contracts/test"
script = "contracts/script"

# Optimizer — enabled for production; disabled in tests for coverage accuracy
optimizer       = true
optimizer_runs  = 200

# IR pipeline — required for complex integration tests with many local variables
# (PW-C08: IntegrationC08.t.sol has functions that exceed the EVM stack without via-ir)
via_ir = true

# Remappings — C09: icm-contracts local library + versioned OZ paths
# OZ v5.6.1 is API-compatible with v5.1.0 for all classes used by StakingManager.
# See docs/PW-C09-AVALANCHE-STAKING-COMPATIBILITY.md §5.5.
remappings = [
    # Primary (unversioned) → v5.6.1: the project-locked dependency.
    # No production contract currently imports OZ directly; this remapping is
    # present so any future OZ imports resolve to the correct locked version.
    "@openzeppelin/contracts/=contracts/lib/openzeppelin-contracts-v561/contracts/",
    "@openzeppelin/contracts-upgradeable/=contracts/lib/openzeppelin-contracts-upgradeable-v561/contracts/",
    # Versioned aliases → v5.1.0: required by Avalanche StakingManager.sol which
    # was authored against OZ v5.1.0 and imports from these explicit paths.
    "@openzeppelin/contracts@5.1.0/=contracts/lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable@5.1.0/=contracts/lib/openzeppelin-contracts-upgradeable/contracts/",
    "@subnet-evm/=contracts/lib/icm-contracts/avalanche/subnet-evm/",
    "@utilities/=contracts/lib/icm-contracts/avalanche/utilities/",
    "validator-manager/=contracts/lib/icm-contracts/avalanche/validator-manager/",
]

# RPC endpoint — local development chain (PW-C01)
[rpc_endpoints]
primewavedev = "http://127.0.0.1:9656/ext/bc/yNRRcwqYaWqn9g4XcAiNe7DufgEHqpF2mmvcG6go1cRvtZo4S/rpc"

# Chain aliases
[etherscan]
# No mainnet/testnet configuration yet — local only

[fmt]
line_length = 120
tab_width   = 4
bracket_spacing = true
